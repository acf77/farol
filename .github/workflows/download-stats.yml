name: Download stats

# GitHub only keeps a lifetime download count per release file. This workflow
# saves those counts once a day to downloads.csv on the `stats` branch, so the
# difference between two days shows how many downloads happened in between.
#
# Columns: date (UTC), release tag, file name, lifetime downloads of that file.
# Farol-mac-arm64.dmg ≈ new installs; latest-mac.yml ≈ update checks by
# installed copies; the .zip is mostly the auto-updater.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Switch to the stats branch
        run: |
          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git fetch --depth=1 origin stats:refs/remotes/origin/stats
            git switch -c stats origin/stats
          else
            git switch --orphan stats
          fi

      - name: Record today's counts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          file=downloads.csv
          today="$(date -u +%F)"
          [ -f "$file" ] || echo "date,tag,asset,downloads" > "$file"
          if grep -q "^$today," "$file"; then
            echo "Counts for $today are already saved."
            exit 0
          fi
          gh api "repos/$REPO/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft | not) | .tag_name as $tag | .assets[] | [$tag, .name, .download_count] | @csv' \
            | sed "s/^/$today,/" >> "$file"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add downloads.csv
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -m "Download counts for $(date -u +%F)"
          git push origin stats
