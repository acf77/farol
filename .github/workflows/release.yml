name: Release

# Bump the version in app/package.json and push to main: this workflow tags the
# commit as v<version>, builds the macOS app and publishes a GitHub Release.
# Pushes that don't change the version are skipped (the tag already exists).
# The landing page links to the fixed-name asset of the latest release:
#   https://github.com/acf77/farol/releases/latest/download/Farol-mac-arm64.dmg
on:
  push:
    branches:
      - main
    paths:
      - app/package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-latest
    env:
      # Secrets can't be read in `if:`; this tells later steps whether the build is signed.
      SIGNED: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether this version is already released
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists — nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.release == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - if: steps.version.outputs.release == 'true'
        run: npm ci

      - name: Tag the release commit
        if: steps.version.outputs.release == 'true'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      # Signs with the Developer ID certificate and notarizes when these secrets
      # exist; without them the build is ad-hoc signed as before.
      #   MAC_CERT_P12_BASE64  base64 of the "Developer ID Application" .p12
      #   MAC_CERT_PASSWORD    the password set when exporting that .p12
      #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID  for notarytool
      - name: Build
        if: steps.version.outputs.release == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run release

      - name: Check the signature
        if: steps.version.outputs.release == 'true' && env.SIGNED == 'true'
        run: |
          app="$(find dist -maxdepth 2 -name 'Farol.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

      # electron-builder uploads in parallel and can split the files over several
      # draft releases, so it only builds; gh publishes one release with every file.
      # The app finds updates through latest-mac.yml and installs the zip.
      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        run: |
          for file in latest-mac.yml Farol-mac-arm64.zip Farol-mac-arm64.dmg; do
            [ -f "dist/$file" ] || { echo "::error::Build output missing: $file"; exit 1; }
          done
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/latest-mac.yml dist/Farol-mac-arm64.zip dist/Farol-mac-arm64.dmg \
            dist/Farol-mac-arm64.zip.blockmap dist/Farol-mac-arm64.dmg.blockmap \
            --title "${{ steps.version.outputs.version }}" --verify-tag --latest --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Drop the tag if the build failed, so re-running the workflow retries this version.
      - name: Remove tag after failed release
        if: failure() && steps.version.outputs.release == 'true'
        run: git push origin --delete "${{ steps.version.outputs.tag }}" || true
